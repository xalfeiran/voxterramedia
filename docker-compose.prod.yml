# NOTE: This file is for Docker-based deployments only (e.g. VPS / dedicated server).
# The production environment is cPanel shared hosting — deploy via GitHub Actions
# (.github/workflows/deploy.yml) which rsyncs directly to the server over SSH.

services:

  # ── MySQL 8 ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: vt_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE}
      MYSQL_USER:          ${DB_USERNAME}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ── PHP-FPM (Laravel) ───────────────────────────────────────────────────
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vt_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
    environment:
      APP_ENV:     production
      APP_DEBUG:   false
      DB_HOST:     mysql
      DB_PORT:     3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  # ── Nginx (serves React SPA + proxies API to PHP) ────────────────────
  nginx:
    image: nginx:alpine
    container_name: vt_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/frontend   # pre-built React app from CI
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl:ro      # optional: mount TLS certs here
    depends_on:
      - php

volumes:
  mysql_data:
