services:

  # ── MySQL 8 ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: vt_mysql
    environment:
      MYSQL_DATABASE:      voxterra
      MYSQL_USER:          voxterra
      MYSQL_PASSWORD:      secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ── PHP-FPM (Laravel) ───────────────────────────────────────────────────
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vt_php
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST:     mysql
      DB_PORT:     3306
      DB_DATABASE: voxterra
      DB_USERNAME: voxterra
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  # ── Nginx ───────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vt_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # ── Node (Vite dev server) ───────────────────────────────────────────────
  node:
    image: node:20-alpine
    container_name: vt_node
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_BASE_URL: http://nginx/api/v1
      VITE_PROXY_TARGET: http://nginx

volumes:
  mysql_data:
