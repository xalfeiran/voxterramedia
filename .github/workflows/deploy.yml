name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Build React frontend ──────────────────────────────────────────────
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 2. Install PHP dependencies ──────────────────────────────────────────
  composer:
    name: Composer install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Upload vendor
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: backend/vendor/
          retention-days: 1

  # ── 3. Deploy to cPanel ──────────────────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build, composer]

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Download vendor
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: backend/vendor/

      # ── SSH setup ────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ── Sync React SPA ───────────────────────────────────────────────────
      - name: Deploy frontend
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            frontend/dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.FRONTEND_PATH }}/"

      # ── Sync Laravel + vendor (never overwrites .env) ────────────────────
      - name: Deploy backend
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude='.env' \
            --exclude='bootstrap/cache/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/app/public/' \
            backend/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.BACKEND_PATH }}/"

      # ── Artisan post-deploy (no composer needed on server) ───────────────
      - name: Post-deploy artisan tasks
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "export LC_ALL=C LANG=C TERM=xterm && \
               PHP=${{ secrets.SSH_PHP_BIN }} && \
               PHP=\${PHP:-php} && \
               cd ${{ secrets.BACKEND_PATH }} && \
               rm -f bootstrap/cache/*.php && \
               \$PHP artisan migrate --force && \
               \$PHP artisan config:cache && \
               \$PHP artisan route:cache && \
               \$PHP artisan view:cache && \
               \$PHP artisan event:cache && \
               \$PHP artisan storage:link --force 2>/dev/null || true && \
               echo Done."
