<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <clipPath id="c">
      <circle cx="44" cy="48" r="38"/>
    </clipPath>
  </defs>

  <!-- Globe body -->
  <circle cx="44" cy="48" r="38" fill="#060d1c" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Minimal grid — readable at 16 px -->
  <g clip-path="url(#c)" fill="none" stroke="#1e4faa" stroke-width="1" opacity="0.7">
    <line x1="6" y1="48" x2="82" y2="48"/>
    <ellipse cx="44" cy="48" rx="17" ry="38"/>
  </g>

  <!-- Broadcast origin dot -->
  <circle cx="82" cy="48" r="4" fill="#22d3ee"/>

  <!-- Broadcast arcs -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round">
    <path d="M82,37 A11,11 0 0,1 82,59" stroke-width="3.5" opacity="1"/>
    <path d="M82,28 A20,20 0 0,1 82,68" stroke-width="2"   opacity="0.5"/>
  </g>
</svg>
