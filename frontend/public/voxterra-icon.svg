<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img">
  <title>VoxTerra.media icon</title>
  <desc>Globe with broadcast signal arcs — VoxTerra.media icon mark</desc>

  <defs>
    <clipPath id="icon-clip">
      <circle cx="44" cy="48" r="40"/>
    </clipPath>
  </defs>

  <!-- Atmosphere rings -->
  <circle cx="44" cy="48" r="44" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.10"/>
  <circle cx="44" cy="48" r="42" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.06"/>

  <!-- Globe body -->
  <circle cx="44" cy="48" r="40" fill="#060d1c" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Globe grid -->
  <g clip-path="url(#icon-clip)" fill="none">
    <line x1="4"  y1="30" x2="84" y2="30" stroke="#1e3a8a" stroke-width="0.8" opacity="0.80"/>
    <line x1="4"  y1="48" x2="84" y2="48" stroke="#2563eb" stroke-width="1.0" opacity="0.70"/>
    <line x1="4"  y1="66" x2="84" y2="66" stroke="#1e3a8a" stroke-width="0.8" opacity="0.80"/>
    <ellipse cx="44" cy="48" rx="14" ry="40" stroke="#1e3a8a" stroke-width="0.8" opacity="0.70"/>
    <ellipse cx="44" cy="48" rx="28" ry="40" stroke="#1e3a8a" stroke-width="0.8" opacity="0.70"/>
    <line x1="44" y1="8"  x2="44" y2="88" stroke="#1e3a8a" stroke-width="0.8" opacity="0.70"/>
  </g>

  <!-- Globe border cap -->
  <circle cx="44" cy="48" r="40" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Broadcast origin dot -->
  <circle cx="84" cy="48" r="3.5" fill="#22d3ee" opacity="0.95"/>

  <!-- Broadcast arcs -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round">
    <path d="M84,37 A11,11 0 0,1 84,59"  stroke-width="3.0" opacity="1.00"/>
    <path d="M84,29 A19,19 0 0,1 84,67"  stroke-width="2.0" opacity="0.55"/>
    <path d="M84,21 A27,27 0 0,1 84,75"  stroke-width="1.3" opacity="0.25"/>
  </g>
</svg>
