<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Performance: DNS prefetch + preconnect ────────────────────────── -->
    <link rel="preconnect" href="https://api.voxterra.media" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- ── Favicons & PWA ────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon" type="image/x-icon"   href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon"            href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="msapplication-TileColor"   content="#060d1c" />
    <meta name="theme-color"               content="#060d1c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary meta ─────────────────────────────────────────────────── -->
    <title>VoxTerra.media — Worldwide News Media Catalog</title>
    <meta name="description" content="Explore an interactive map of news media outlets from every country. Search, filter, and discover thousands of newspapers, TV channels, radio stations, and digital media around the globe." />
    <meta name="keywords"    content="news media catalog, global media directory, international newspapers, TV channels worldwide, radio stations, digital news outlets, journalism resources, media map, worldwide press, news outlets by country" />
    <meta name="author"      content="Mindware — mindware.com.mx" />
    <meta name="robots"      content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <link rel="canonical"    href="https://voxterra.media" />

    <!-- ── Hreflang (static shell; JS hook updates per route) ───────────── -->
    <link rel="alternate" hreflang="en"        href="https://voxterra.media" />
    <link rel="alternate" hreflang="es"        href="https://voxterra.media" />
    <link rel="alternate" hreflang="x-default" href="https://voxterra.media" />

    <!-- ── Open Graph ───────────────────────────────────────────────────── -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://voxterra.media" />
    <meta property="og:site_name"    content="VoxTerra.media" />
    <meta property="og:locale"       content="en_US" />
    <meta property="og:title"        content="VoxTerra.media — Worldwide News Media Catalog" />
    <meta property="og:description"  content="Explore an interactive map of news media outlets from every country. Search, filter, and discover thousands of newspapers, TV channels, radio stations, and digital media around the globe." />
    <meta property="og:image"        content="https://voxterra.media/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="VoxTerra.media — interactive globe showing worldwide news media outlets" />

    <!-- ── Twitter / X Card ─────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@VoxTerra" />
    <meta name="twitter:creator"     content="@mindwaremx" />
    <meta name="twitter:title"       content="VoxTerra.media — Worldwide News Media Catalog" />
    <meta name="twitter:description" content="Explore an interactive map of news media outlets from every country. Discover newspapers, TV, radio and digital media worldwide." />
    <meta name="twitter:image"       content="https://voxterra.media/og-image.png" />
    <meta name="twitter:image:alt"   content="VoxTerra.media interactive world media map" />

    <!-- ── JSON-LD: static shell (JS hook adds richer per-page schemas) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VoxTerra.media",
      "url": "https://voxterra.media",
      "description": "Worldwide catalog of news media outlets — newspapers, TV, radio, and digital media from every country.",
      "inLanguage": ["en", "es"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://voxterra.media/explore?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── Google Analytics ─────────────────────────────────────────────── -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3SQTQBNQDD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3SQTQBNQDD');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
